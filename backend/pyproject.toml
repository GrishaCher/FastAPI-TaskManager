[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["GrishaCher <grish.chernikow2016@yandex.ru>"]
readme = "README.md"
packages = [{include = "app", from = "."}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.116.1"
uvicorn = "^0.35.0"
sqlalchemy = "^2.0.41"
python-dotenv = "^1.1.1"
alembic = "^1.16.4"
pydantic = {extras = ["email"], version = "^2.11.7"}
pydantic-settings = "^2.10.1"
asyncpg = "^0.30.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
email-validator = "^2.2.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
migrate = "app.alembic.run:main"
migrate-up = "app.alembic.run:upgrade"
migrate-down = "app.alembic.run:downgrade"
migrate-create = "app.alembic.run:create_migration"
